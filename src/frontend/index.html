<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homeschool Recordkeeping Platform</title>
    <script>
      (function () {
        var storedTheme = localStorage.getItem("homeschool.theme");
        var dark = storedTheme
          ? storedTheme === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");

        var accent = localStorage.getItem("homeschool.accent");
        if (accent && accent !== "default") document.documentElement.setAttribute("data-accent", accent);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
