<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page {
    size: letter;
    margin: 1in 0.75in;
    @bottom-center {
      content: "Page " counter(page) " of " counter(pages);
      font-size: 9px;
      color: #666;
    }
  }
  body { font-family: sans-serif; font-size: 11px; color: #111; }
  h1 { font-size: 18px; margin: 0 0 4px 0; }
  .meta { color: #555; font-size: 10px; margin-bottom: 16px; line-height: 1.5; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; font-size: 10px; }
  th { background: #f2f2f2; }
  .totals { margin-top: 12px; font-weight: bold; }
  .disclaimer { margin-top: 24px; font-size: 8px; color: #888; }
</style>
</head>
<body>
  <h1>{{ title }}</h1>
  <div class="meta">
    {{ family_name }} &mdash; {{ student_name }}{% if grade %} ({{ grade }}){% endif %}<br>
    School Year: {{ school_year_name }}<br>
    Generated: {{ generated_date }}
  </div>
  {% block content %}{% endblock %}
</body>
</html>
